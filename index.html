<html lang="en" data-theme="dash">

    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=3" />

    <link rel="manifest" href="/site.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta name="description" content="Follow along as Anthony drives a loop of Tesla Superchargers across the country: where he is today, the full route, and notes and videos from the road." />

    <meta property="og:url" content="https://www.teslachargequest.com/" />
    <meta property="og:site_name" content="ChargeQuest" />
    <meta property="og:title" content="ChargeQuest · Follow Anthony’s Supercharger road trip" />
    <meta property="og:description" content="Follow along as Anthony drives a loop of Tesla Superchargers across the country: where he is today, the full route, and notes and videos from the road." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ChargeQuest · Follow Anthony’s Supercharger road trip" />
    <meta name="twitter:description" content="Follow along as Anthony drives a loop of Tesla Superchargers across the country: where he is today, the full route, and notes and videos from the road." />
    <meta name="twitter:image" content="https://www.teslachargequest.com/social/chargequest-home.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // No-flash theme init. Dark ("dash") is the default.
      (function () {
        try {
          var t = localStorage.getItem('sqp-theme')
          if (t !== 'tesla' && t !== 'dash') t = 'dash'
          document.documentElement.setAttribute('data-theme', t)
          var meta = document.getElementById('theme-color-meta')
          if (meta) meta.setAttribute('content', t === 'tesla' ? '#ffffff' : '#0a0d12')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dash')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
